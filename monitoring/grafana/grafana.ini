# Grafana for RootIQ. start.sh sets the folders and the passwords from backend/.env.
[server]
http_addr = 127.0.0.1
http_port = 3000

[users]
default_theme = dark

# Anyone on this computer can view the dashboard. Only the admin can change it.
[auth.anonymous]
enabled = true
org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[unified_alerting]
enabled = true
min_interval = 10s

[news]
news_feed_enabled = false
